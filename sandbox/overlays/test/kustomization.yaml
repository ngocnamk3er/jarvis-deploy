apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

# Jenkins job `jarvis-sandbox` exists (2026-09-08) but its GitLab push
# webhook isn't wired yet — until it runs, images are built locally and
# `minikube image load`ed under a commit-SHA tag, bumped here by hand.
# `minikube image load` silently no-ops if the tag already exists on the
# node, so always load under a NEW tag. The job's "Bump manifest" stage
# overwrites this images: block (switching newName to the registry).
# NOTE: quote the tag — an unquoted 7-hex like 6264e35 is valid YAML
# scientific notation and kustomize rejects it as a number.
images:
- name: jarvis-sandbox
  newTag: "11f5c32b"
