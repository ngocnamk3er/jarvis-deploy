# Locks down the per-conversation agent pods: default-deny both directions,
# with two narrow holes.
#
#   ingress — only the orchestrator, on the agent's HTTP port
#   egress  — only DNS
#
# No internet, no other pod or Service, no node metadata endpoint. The agent's
# whole toolchain is baked into the image (pip/uv are stripped, the rootfs is
# read-only), so it has nothing to fetch — this keeps it that way and removes
# any egress-driven cost or exfiltration path. DNS stays open only so a stray
# `curl <url>` fails fast instead of hanging on name resolution.
#
# REQUIRES a NetworkPolicy-enforcing CNI. minikube's default bridge/kindnet
# does NOT enforce these — start the cluster with `--cni=calico` (or enable the
# calico addon). Without enforcement the policy is inert but harmless.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-agent
  namespace: jarvis
spec:
  podSelector:
    matchLabels:
      app: jarvis-sandbox-agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: sandbox
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
