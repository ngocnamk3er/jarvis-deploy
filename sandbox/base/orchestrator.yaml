apiVersion: v1
kind: ServiceAccount
metadata:
  name: jarvis-sandbox-orchestrator
  namespace: jarvis
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jarvis-sandbox-orchestrator
  namespace: jarvis
rules:
  # The orchestrator creates one agent Pod per conversation, patches its
  # labels/annotations on claim, reads status to wait for Ready, and deletes
  # it on reset / idle GC. Scoped to Pods in the `jarvis` namespace only.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jarvis-sandbox-orchestrator
  namespace: jarvis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jarvis-sandbox-orchestrator
subjects:
  - kind: ServiceAccount
    name: jarvis-sandbox-orchestrator
    namespace: jarvis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox
  namespace: jarvis
spec:
  replicas: 1
  # Exactly one orchestrator at a time — two would race on the warm pool.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sandbox
  template:
    metadata:
      labels:
        app: sandbox
    spec:
      serviceAccountName: jarvis-sandbox-orchestrator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestrator
          image: jarvis-sandbox:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - configMapRef:
                name: sandbox-config
            - secretRef:
                name: jarvis-secrets # provides INTERNAL_API_KEY (shared with backend)
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox
  namespace: jarvis
spec:
  selector:
    app: sandbox
  ports:
    - port: 8000
      targetPort: 8000
