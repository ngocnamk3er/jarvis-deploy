apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox
  namespace: jarvis
spec:
  replicas: 1
  # One shared container; a rolling update would briefly run two, both
  # mounting fresh emptyDirs — fine (workspaces are ephemeral anyway), but
  # Recreate keeps it to exactly one at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sandbox
  template:
    metadata:
      labels:
        app: sandbox
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: sandbox
          image: jarvis-sandbox:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: sandbox-config
            - secretRef:
                name: jarvis-secrets
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        # Ephemeral by design — every conversation's /workspace/{thread_id}
        # is throwaway, wiped on pod restart.
        - name: workspace
          emptyDir:
            sizeLimit: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox
  namespace: jarvis
spec:
  selector:
    app: sandbox
  ports:
    - port: 8000
      targetPort: 8000
