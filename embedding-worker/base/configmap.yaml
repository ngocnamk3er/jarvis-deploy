apiVersion: v1
kind: ConfigMap
metadata:
  name: embedding-worker-config
  namespace: jarvis
data:
  APP_NAME: "Jarvis Embedding Worker"
  APP_VERSION: "0.1.0"
  QDRANT_URL: "http://qdrant:6333"
  # Self-hosted — must stay identical to file-service-config's own
  # EMBEDDING_BASE_URL/MODEL (see that file's comment for why: this
  # service indexes with whatever model file-service queries with later,
  # and a mismatch silently produces garbage search results, not an error).
  EMBEDDING_BASE_URL: "http://embedding-server/v1"
  EMBEDDING_MODEL: "bge-m3"
  EMBEDDING_DIMENSIONS: "1024"
  RABBITMQ_HOST: "rabbitmq"
