apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Same manifests k8s/deploy.sh applies (steps 3, 5-9) — secrets are
# intentionally not listed here: deploy.sh creates them imperatively from
# local .env files and they stay that way, not managed by ArgoCD/GitOps.
resources:
- 00-namespace.yaml
- configmap.yaml
- postgres.yaml
- keycloak-postgres.yaml
- keycloak.yaml
- backend.yaml
- frontend.yaml
- ingress.yaml

# Rewritten by each app repo's own Jenkinsfile "Bump manifest" stage after
# its own image push (`kustomize edit set image ...` against a clone of
# *this* repo), so ArgoCD deploys the exact commit-SHA-tagged image that
# repo's pipeline just built — not floating :local tags. One project per
# image now (jarvis-backend, jarvis-frontend, jarvis-keycloak repos are
# split out), so no more root/jarvis/<name> sub-path — each image is its
# own project's default container repository.
images:
- name: jarvis-backend
  newName: host.minikube.internal:5050/root/jarvis-backend
  newTag: 344b92d3
- name: jarvis-frontend
  newName: host.minikube.internal:5050/root/jarvis-frontend
  newTag: 49e12f38
- name: jarvis-keycloak
  newName: host.minikube.internal:5050/root/jarvis-keycloak
  newTag: f2b1fd13
