apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: jarvis
data:
  APP_NAME: "Jarvis"
  APP_VERSION: "0.1.1"
  API_PREFIX: "/api/v1"
  OPENROUTER_BASE_URL: "https://openrouter.ai/api/v1"
  OPENROUTER_MODEL: "deepseek/deepseek-r1-0528-qwen3-8b:free"
  OPENROUTER_FALLBACK_MODELS: "deepseek/deepseek-v4-flash,deepseek/deepseek-v4-pro"
  FRONTEND_URL: "http://jarvis.local"
  # jarvis-conversation-service — owns conversations/subagent_traces since
  # the Chapter 2 decomposition. In-cluster Service DNS, same reasoning as
  # OIDC_JWKS_URL below: this is a plain internal call, not an
  # issuer/identity-matching concern, so no ingress hostname needed.
  CONVERSATION_SERVICE_URL: "http://conversation-service.jarvis.svc.cluster.local:8000"
  # jarvis-file-service — owns the per-user file workspace (tree metadata +
  # MinIO + Qdrant). Same in-cluster Service DNS reasoning as
  # CONVERSATION_SERVICE_URL above.
  FILE_SERVICE_URL: "http://file-service.jarvis.svc.cluster.local:8000"
  OIDC_ISSUER: "http://auth.jarvis.local/realms/jarvis"
  OIDC_AUDIENCE: "jarvis-frontend"
  # In-cluster Service DNS — JWKS fetching is just a key lookup, it doesn't
  # need to match the external issuer hostname (unlike OIDC_ISSUER above,
  # which must match the "iss" claim string exactly).
  OIDC_JWKS_URL: "http://keycloak.jarvis.svc.cluster.local:8080/realms/jarvis/protocol/openid-connect/certs"
  OIDC_JWKS_CACHE_TTL_SECONDS: "3600"
  LLM_CACHE: "false"
  # Langfuse. In-cluster Service DNS, same reasoning as the two service
  # URLs above — the backend only posts trace batches, it never needs the
  # hostname a browser would use. The keys that go with this live in
  # jarvis-secrets (deploy.sh), which is deliberately not GitOps-managed.
  LANGFUSE_HOST: "http://langfuse-web.jarvis.svc.cluster.local:3000"
  # Stamped on every trace. Keeps this cluster's runs distinguishable from
  # staging's if both ever report into one Langfuse.
  LANGFUSE_ENVIRONMENT: "test"
  # Deliberately kept on agent-sandbox's stock pool, not jarvis's own — see
  # sandbox_manager.py's exec_bash() docstring (jarvis-backend repo) for the
  # bash -c wrapping fix that makes this actually work correctly now.
  AGENTSANDBOX_WARMPOOL: "python-sandbox-pool"
