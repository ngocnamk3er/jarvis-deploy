apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: jarvis
spec:
  # Fixed at 1 — chat_service.py tracks in-flight streams/cancellation in a
  # per-process dict with no shared queue, so multiple replicas without
  # sticky sessions would silently break the Stop button. See plan.
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Lets the pod talk to the agent-sandbox CRDs (sandboxclaims/sandboxes
      # in the default namespace) — see app/agents/tools/sandbox_manager.py
      # and jarvis-deploy's argocd/agentsandbox-application.yaml (RBAC
      # applied separately, deliberately not via automated GitOps).
      serviceAccountName: jarvis-backend
      # Named here rather than inherited. deploy.sh attaches this secret to
      # the namespace's *default* ServiceAccount, which is how frontend,
      # keycloak, file-service and conversation-service pull from the GitLab
      # registry without saying so — but this pod runs as jarvis-backend,
      # which inherits nothing from default. It only ever worked because the
      # image happened to be cached on the node already; the first genuinely
      # new tag (2026-09-26) failed with "denied: access forbidden" and had
      # to be `minikube image load`ed by hand. On the pod spec rather than on
      # the ServiceAccount because that account is created by hand from
      # SANDBOX-SETUP.md, outside GitOps, and would lose the setting the
      # next time someone recreates it.
      imagePullSecrets:
        - name: gitlab-registry-creds
      containers:
        - name: backend
          image: jarvis-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: jarvis-secrets
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: jarvis
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
