apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: jarvis
spec:
  # 1 by default. More than one works as long as REDIS_URL is set: the Stop button reaches the replica that runs the
  # chat (the conversation lock names it, core/run_control.py), the sandbox ceiling and the research tasks are shared
  # (core/sandbox_coordination.py, core/run_control.py), and a replica that is replaced finishes its runs first (below).
  # What is NOT covered: a run lives in the memory of one replica, so it ends if that replica crashes, and the browser
  # cannot reattach to it (a queue would, at a lot more machinery: see SCALE-OUT.md in jarvis-backend).
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Lets the pod talk to the agent-sandbox CRDs (sandboxclaims/sandboxes
      # in the default namespace) — see app/agents/tools/sandbox_manager.py
      # and jarvis-deploy's argocd/agentsandbox-application.yaml (RBAC
      # applied separately, deliberately not via automated GitOps).
      serviceAccountName: jarvis-backend
      # A replica being replaced (a rolling update, a scale-down) stops taking requests, and uvicorn waits for the open
      # streams to end before the app drains the runs that have no browser attached (SHUTDOWN_DRAIN_SECONDS, 600).
      # The default 30 s killed every run that was still going; a chat run can take minutes.
      terminationGracePeriodSeconds: 900
      # Named here rather than inherited. deploy.sh attaches this secret to
      # the namespace's *default* ServiceAccount, which is how frontend,
      # keycloak, file-service and conversation-service pull from the GitLab
      # registry without saying so — but this pod runs as jarvis-backend,
      # which inherits nothing from default. It only ever worked because the
      # image happened to be cached on the node already; the first genuinely
      # new tag (2026-09-26) failed with "denied: access forbidden" and had
      # to be `minikube image load`ed by hand. On the pod spec rather than on
      # the ServiceAccount because that account is created by hand from
      # SANDBOX-SETUP.md, outside GitOps, and would lose the setting the
      # next time someone recreates it.
      imagePullSecrets:
        - name: gitlab-registry-creds
      containers:
        - name: backend
          image: jarvis-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: jarvis-secrets
          # With a request the pod is Burstable instead of BestEffort, so under node memory pressure it is no longer the
          # first thing evicted. CPU: 500m is what this process used under a GET load on the test cluster (~740m peak
          # at ~120 req/s, one uvicorn process, so about a core is its ceiling); no CPU limit on purpose, a limit only
          # throttles it. Memory: 298Mi peak under that same load; the 2Gi limit is a generous guess for real chat runs
          # (nothing measured them), there to stop a leak from taking the node rather than to size the pod. Re-measure
          # with `kubectl top pod` under real chat use.
          # A few seconds' head start so the Service and the ingress stop sending this pod new requests before it
          # begins to shut down.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {memory: 2Gi}
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: jarvis
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
