apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: jarvis
spec:
  # Fixed at 1 — chat_service.py tracks in-flight streams/cancellation in a
  # per-process dict with no shared queue, so multiple replicas without
  # sticky sessions would silently break the Stop button. See plan.
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: migrate
          image: jarvis-backend:local
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: jarvis-config
            - secretRef:
                name: jarvis-secrets
      containers:
        - name: backend
          image: jarvis-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: jarvis-config
            - secretRef:
                name: jarvis-secrets
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: jarvis
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
