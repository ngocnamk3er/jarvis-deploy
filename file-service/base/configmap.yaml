apiVersion: v1
kind: ConfigMap
metadata:
  name: file-service-config
  namespace: jarvis
data:
  APP_NAME: "Jarvis File Service"
  APP_VERSION: "0.1.0"
  API_PREFIX: "/api/v1"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_BUCKET: "jarvis-files"
  MINIO_SECURE: "false"
  QDRANT_URL: "http://qdrant:6333"
  EMBEDDING_BASE_URL: "https://openrouter.ai/api/v1"
  # text-embedding-3-large @1024 dims — BEIR SciFact nDCG@10 0.77 / NFCorpus
  # 0.41 (bge-m3 was 0.65 / 0.32). 1024 keeps the Qdrant collection size.
  EMBEDDING_MODEL: "openai/text-embedding-3-large"
  EMBEDDING_DIMENSIONS: "1024"
