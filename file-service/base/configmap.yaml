apiVersion: v1
kind: ConfigMap
metadata:
  name: file-service-config
  namespace: jarvis
data:
  APP_NAME: "Jarvis File Service"
  APP_VERSION: "0.1.0"
  API_PREFIX: "/api/v1"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_BUCKET: "jarvis-files"
  MINIO_SECURE: "false"
  QDRANT_URL: "http://qdrant:6333"
  EMBEDDING_BASE_URL: "https://openrouter.ai/api/v1"
  EMBEDDING_MODEL: "baai/bge-m3"
