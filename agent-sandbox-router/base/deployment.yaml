# The sandbox-router: proxies jarvis-backend's exec/file calls to the right
# Sandbox pod. Runs kubernetes-sigs/agent-sandbox's own published router image
# with the config from their sandbox_router.yaml quickstart, rather than a
# self-built one.
#
# History worth knowing, because this was briefly the opposite: an earlier
# pass here ran a self-built Go router (v1.0.2 source) with
# --authz-mode=tokenreview and --cache-enabled=true, on the belief that the
# published image was an old Python build that 502'd for lack of a pod-IP
# cache and had no authz at all. Both beliefs were tested on 2026-09-15 and
# turned out wrong:
#
#   - No 502s. The SDK resolves the pod IP itself from the Sandbox CR's
#     .status.podIPs (jarvis-backend already has `sandboxes: get`) and sends
#     it as X-Sandbox-Pod-IP, so the router just forwards — it never needs to
#     resolve anything, which is also why upstream's YAML ships no RBAC.
#   - The published image does have auth, via ALLOW_UNAUTHENTICATED_ROUTER +
#     ROUTER_AUTH_TOKEN (a single shared token). Verified: with it enabled, an
#     unauthenticated call gets a real 401.
#
# ALLOW_UNAUTHENTICATED_ROUTER is set to "true" here, matching the quickstart
# rather than upstream's file default of "false". That is a deliberate
# trade-off for this deployment's scope (only jarvis-backend calls the
# router, on the FE -> BE -> sandbox path): per-conversation isolation does
# NOT depend on this flag — each conversation gets its own pod either way,
# verified live with two conversations where B could not see or read A's
# files. What "true" gives up is rejecting callers that present no token, so
# any workload able to reach this Service could address any sandbox. Flipping
# to "false" needs a Secret plus a matching token on jarvis-backend's side;
# see AGENTSANDBOX-MIGRATION.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-router-deployment
  namespace: agent-sandbox-system
  labels:
    app: sandbox-router
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sandbox-router
  template:
    metadata:
      labels:
        app: sandbox-router
    spec:
      containers:
      - name: router
        image: sandbox-router # replaced by the overlay
        env:
        - name: PROXY_TIMEOUT_SECONDS
          value: "180"
        - name: WEBSOCKET_IDLE_TIMEOUT_SECONDS
          value: "3600"
        - name: WEBSOCKET_MAX_LIFETIME_SECONDS
          value: "86400"
        - name: WEBSOCKET_MAX_MESSAGE_BYTES
          value: "16777216"
        # Per-client caps stay disabled until TRUSTED_PROXY_CIDRS is set —
        # nothing fronts this Service today, so every caller would otherwise
        # share one proxy peer IP.
        - name: WEBSOCKET_MAX_CONNECTIONS_PER_CLIENT
          value: "0"
        - name: ALLOW_UNAUTHENTICATED_ROUTER
          value: "true"
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests: {cpu: "250m", memory: "512Mi"}
          limits: {cpu: "1000m", memory: "1Gi"}
      # Upstream's own security context. Deliberately not the stricter set
      # this file used to carry for the Go binary — in particular
      # readOnlyRootFilesystem is left off, since this is a Python app that
      # may want scratch space, and the hardened variant was never tested
      # against this image.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      terminationGracePeriodSeconds: 45
