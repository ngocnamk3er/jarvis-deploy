apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

# Upstream's published router image — nothing local builds this, so there is
# no tag to bump on a push and no Jenkins job to wire up. Pinned to the same
# tag the quickstart uses.
images:
- name: sandbox-router
  newName: us-central1-docker.pkg.dev/k8s-staging-images/agent-sandbox/sandbox-router
  newTag: "latest-main"
