apiVersion: v1
kind: ConfigMap
metadata:
  name: jarvis-config
  namespace: jarvis
data:
  APP_NAME: "Jarvis"
  APP_VERSION: "0.1.1"
  API_PREFIX: "/api/v1"
  OPENROUTER_BASE_URL: "https://openrouter.ai/api/v1"
  OPENROUTER_MODEL: "deepseek/deepseek-r1-0528-qwen3-8b:free"
  OPENROUTER_FALLBACK_MODELS: "deepseek/deepseek-v4-flash,deepseek/deepseek-v4-pro"
  FRONTEND_URL: "http://jarvis.local"
  OIDC_ISSUER: "http://auth.jarvis.local/realms/jarvis"
  OIDC_AUDIENCE: "jarvis-frontend"
  # In-cluster Service DNS — JWKS fetching is just a key lookup, it doesn't
  # need to match the external issuer hostname (unlike OIDC_ISSUER above,
  # which must match the "iss" claim string exactly).
  OIDC_JWKS_URL: "http://keycloak.jarvis.svc.cluster.local:8080/realms/jarvis/protocol/openid-connect/certs"
  OIDC_JWKS_CACHE_TTL_SECONDS: "3600"
  LLM_CACHE: "false"
  # bash tool's sandbox backend — same-cluster pod-to-pod call (opensandbox
  # deployed via helm into opensandbox-system, see k8s/opensandbox-ingress.yaml
  # for the separate external-hostname route used by the local bare-process
  # backend). No issuer/identity-matching concern here (unlike OIDC_ISSUER
  # above), so plain in-cluster Service DNS is correct and simpler than
  # going out through the ingress hostname.
  SANDBOX_SERVER_DOMAIN: "opensandbox-server.opensandbox-system.svc.cluster.local:80"
