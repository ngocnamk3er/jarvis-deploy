apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jarvis
  namespace: jarvis
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # SSE streaming (chat/stream) must not be buffered by the proxy.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # NextAuth's JWT session cookie carries the Keycloak access/refresh/id
    # tokens and exceeds nginx's default header buffer on login — verified
    # live ("upstream sent too big header" on /api/auth/callback/keycloak,
    # a 502). Standard fix for NextAuth behind nginx ingress.
    nginx.ingress.kubernetes.io/proxy-buffer-size: "32k"
    nginx.ingress.kubernetes.io/large-client-header-buffers: "4 32k"
spec:
  ingressClassName: nginx
  rules:
    - host: jarvis.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    - host: api.jarvis.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
    - host: auth.jarvis.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
