apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

# No configmap patch needed here, unlike backend/frontend/keycloak's staging
# overlays — this service is internal-only (no ingress, no externally
# visible hostname), so the same config is correct in every environment.
#
# Image tag: bumped only via an explicit promote step (`kustomize edit set
# image` run from this directory), copying whatever tag is currently live in
# overlays/test — never automatically, and never a git merge from main. See
# STAGING-CICD-NOTES.md's "promote" section.
