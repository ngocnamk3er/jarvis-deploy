apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

# No Jenkins job builds Dockerfile.agentsandbox yet (unlike sandbox/, which
# has one bumping this same pattern automatically on every push — see that
# Jenkinsfile). Until that exists, this tag is bumped by hand exactly the
# way sandbox/overlays/test was before its own job was wired up: build +
# push/minikube-image-load, then `kustomize edit set image` here.
# NOTE: quote the tag if it's ever a bare hex string (kustomize/YAML
# ambiguity with scientific notation — jarvis-sandbox learned this the hard way).
images:
- name: jarvis-sandbox-agentsandbox
  newName: host.minikube.internal:5050/root/jarvis-sandbox
  newTag: "agentsandbox-1789297905"
