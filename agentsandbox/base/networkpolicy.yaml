# Mirrors sandbox/base/networkpolicy.yaml's posture for the legacy agent
# pods: ingress only from the caller (jarvis-backend, once cutover happens —
# today jarvis-backend doesn't call this path at all), egress only DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jarvis-agentsandbox-agent
  namespace: default
spec:
  podSelector:
    matchLabels: {app: jarvis-agentsandbox-agent}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels: {app: backend}
      ports:
        - {protocol: TCP, port: 8888}
  egress:
    - to:
        - namespaceSelector: {}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
