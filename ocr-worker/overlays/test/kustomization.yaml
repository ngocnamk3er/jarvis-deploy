apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

# Placeholder until jarvis-ocr-worker's Jenkins job runs its first build —
# the "Bump manifest" stage overwrites this with the real pushed tag (same
# flow as every other service here). Pods sit in ImagePullBackOff until
# that first build lands, which is expected and matches how
# jarvis-conversation-service's CI was bootstrapped from scratch earlier.
images:
- name: jarvis-ocr-worker
  newName: host.minikube.internal:5050/root/jarvis-ocr-worker
  newTag: 370f8b5a
