apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jarvis-staging-shared
  namespace: argocd
spec:
  project: default
  source:
    # Same repo/branch as the test Applications — the difference from
    # test lives in the PATH, not the branch: shared/overlays/staging is
    # a Kustomize overlay on top of shared/base, patching just the 3
    # hostnames that must differ from test (shared external /etc/hosts on
    # one machine can't map jarvis.local to two different cluster IPs at
    # once — see shared/overlays/staging/ingress-hosts-patch.yaml).
    # Promotion = bumping an overlay's image tag with `kustomize edit set
    # image`, never a git merge — so it can't conflict with these patches
    # (they live in files main's own commits never touch).
    repoURL: http://host.minikube.internal:8929/root/jarvis-deploy.git
    targetRevision: main
    path: shared/overlays/staging
  destination:
    # Registered via a Secret in this Application's own "argocd" namespace
    # (argocd.argoproj.io/secret-type: cluster, name: staging) pointing at
    # https://host.minikube.internal:18443 — a socat forward on the host
    # to the staging minikube profile's real API server (192.168.58.2:8443).
    # Pods inside this cluster can't reach that IP directly: minikube's two
    # profiles sit on separate, isolated Docker bridge networks, and
    # attaching the staging node container to this cluster's network
    # directly (docker network connect) breaks minikube's own IP-detection
    # and crashes the node — verified live. Forwarding through the host,
    # the same way GitLab itself is reached, avoids that entirely.
    server: https://host.minikube.internal:18443
    namespace: jarvis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
