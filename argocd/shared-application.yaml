apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jarvis-shared
  namespace: argocd
spec:
  project: default
  source:
    # ArgoCD runs inside minikube; GitLab runs as docker-compose on the
    # host, reached via minikube's built-in host.minikube.internal DNS
    # alias (resolves to the host regardless of this machine's own IP —
    # tried the host's real LAN IP instead at one point, but that's a
    # DHCP-assigned address that can change on its own, whereas this
    # alias doesn't, so it's the more robust choice for a single-machine
    # setup like this one. A real IP/DNS name would still be required if
    # ArgoCD's cluster and GitLab ever end up on separate machines — this
    # alias only resolves inside this one minikube node's own Docker
    # network).
    repoURL: http://host.minikube.internal:8929/root/jarvis-deploy.git
    targetRevision: main
    path: shared
  destination:
    server: https://kubernetes.default.svc
    namespace: jarvis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
