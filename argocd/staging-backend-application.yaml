apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jarvis-staging-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://host.minikube.internal:8929/root/jarvis-deploy.git
    targetRevision: main
    path: backend/overlays/staging
  destination:
    server: https://host.minikube.internal:18443
    namespace: jarvis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
